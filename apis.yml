description: 10percenthappier (now branded Happier Meditation) is a personalized meditation
  and mindfulness company offering a consumer mobile app with over 500 guided meditations,
  multi-day courses, and daily mindfulness practices led by expert teachers. The app
  adapts to the user with monthly check-ins and daily recommendations, and is available
  on iOS and Android. Surfaced as a portfolio company of Techstars and added to the
  API Evangelist network. The company operates a consumer product and does not currently
  publish a public developer API, developer portal, or API documentation.
